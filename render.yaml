services:
  - type: web
    name: planno-store-back
    runtime: docker
    plan: starter
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_STORE_PROVISIONING_SERVICE_TOKEN
        sync: false
      - key: APP_STORE_PROVISIONING_DOMAIN_SUFFIX
        value: planno.store
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET_BASE64
        sync: false
      - key: APP_PAYMENT_CREDENTIALS_ENCRYPTION_KEY_BASE64
        sync: false
      - key: APP_PAYMENT_MERCADO_PAGO_CLIENT_ID
        sync: false
      - key: APP_PAYMENT_MERCADO_PAGO_CLIENT_SECRET
        sync: false
      - key: APP_PAYMENT_MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: APP_PAYMENT_MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: APP_PAYMENT_MERCADO_PAGO_WEBHOOK_URL
        sync: false
      - key: APP_PAYMENT_MERCADO_PAGO_SUCCESS_URL
        sync: false
      - key: APP_PAYMENT_MERCADO_PAGO_PENDING_URL
        sync: false
      - key: APP_PAYMENT_MERCADO_PAGO_FAILURE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_MEDIA_SUPABASE_PUBLIC_BASE_URL
        sync: false
      - key: APP_MEDIA_SUPABASE_BUCKET
        value: store-assets
      - key: APP_MEDIA_SUPABASE_STORE_IMAGE_FOLDER
        value: stores
      - key: APP_BOOTSTRAP_STORE_ENABLED
        value: "true"
      - key: APP_BOOTSTRAP_STORE_NAME
        sync: false
      - key: APP_BOOTSTRAP_STORE_SLUG
        sync: false
      - key: APP_BOOTSTRAP_STORE_CONTACT_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_STORE_DESCRIPTION
        sync: false
      - key: APP_BOOTSTRAP_STORE_LOGO_URL
        value: ""
      - key: APP_BOOTSTRAP_STORE_BANNER_URL
        value: ""
      - key: APP_BOOTSTRAP_STORE_PRIMARY_COLOR
        value: "#111827"
      - key: APP_BOOTSTRAP_STORE_SECONDARY_COLOR
        value: "#10b981"
      - key: APP_BOOTSTRAP_STORE_COMMISSION_RATE
        value: "2.50"
      - key: APP_BOOTSTRAP_ADMIN_ENABLED
        value: "true"
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_FIRST_NAME
        value: Admin
      - key: APP_BOOTSTRAP_ADMIN_LAST_NAME
        value: Planno
