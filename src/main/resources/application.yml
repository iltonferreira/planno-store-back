spring:
  application:
    name: planno-store-back
  mail:
    host: ${APP_EMAIL_2FA_SMTP_HOST:}
    port: ${APP_EMAIL_2FA_SMTP_PORT:587}
    username: ${APP_EMAIL_2FA_SMTP_USERNAME:}
    password: ${APP_EMAIL_2FA_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        default_schema: ${DB_SCHEMA:public}
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never

app:
  order-reservation:
    ttl: ${APP_ORDER_RESERVATION_TTL:PT30M}
    enabled: ${APP_ORDER_RESERVATION_ENABLED:true}
    batch-size: ${APP_ORDER_RESERVATION_BATCH_SIZE:100}
    fixed-delay: ${APP_ORDER_RESERVATION_FIXED_DELAY:PT1M}
  store-provisioning:
    service-token: ${APP_STORE_PROVISIONING_SERVICE_TOKEN:}
    domain-suffix: ${APP_STORE_PROVISIONING_DOMAIN_SUFFIX:planno.online}
  store-context:
    header-name: ${APP_STORE_CONTEXT_HEADER_NAME:X-Store-Slug}
  cart:
    token-header-name: ${APP_CART_TOKEN_HEADER_NAME:X-Cart-Token}
  security:
    email-two-factor:
      from: ${APP_EMAIL_2FA_FROM:}
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:180}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201}
      allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.planno.online,https://*.pages.dev}
  payment:
    operations-enabled: ${APP_PAYMENT_OPERATIONS_ENABLED:false}
    credentials-encryption-key-base64: ${APP_PAYMENT_CREDENTIALS_ENCRYPTION_KEY_BASE64:}
    oauth:
      state-ttl-minutes: ${APP_PAYMENT_OAUTH_STATE_TTL_MINUTES:10}
    mercado-pago:
      mock-enabled: ${APP_PAYMENT_MERCADO_PAGO_MOCK_ENABLED:false}
      client-id: ${APP_PAYMENT_MERCADO_PAGO_CLIENT_ID:}
      client-secret: ${APP_PAYMENT_MERCADO_PAGO_CLIENT_SECRET:}
      access-token: ${APP_PAYMENT_MERCADO_PAGO_ACCESS_TOKEN:}
      webhook-secret: ${APP_PAYMENT_MERCADO_PAGO_WEBHOOK_SECRET:}
      webhook-url: ${APP_PAYMENT_MERCADO_PAGO_WEBHOOK_URL:http://localhost:8080/api/v1/public/webhooks/mercado-pago}
      success-url: ${APP_PAYMENT_MERCADO_PAGO_SUCCESS_URL:http://localhost:3000/checkout/success}
      pending-url: ${APP_PAYMENT_MERCADO_PAGO_PENDING_URL:http://localhost:3000/checkout/pending}
      failure-url: ${APP_PAYMENT_MERCADO_PAGO_FAILURE_URL:http://localhost:3000/checkout/failure}
      api-base-url: ${APP_PAYMENT_MERCADO_PAGO_API_BASE_URL:https://api.mercadopago.com}
      auth-base-url: ${APP_PAYMENT_MERCADO_PAGO_AUTH_BASE_URL:https://auth.mercadopago.com}
      test-token: ${APP_PAYMENT_MERCADO_PAGO_TEST_TOKEN:false}
  bootstrap:
    store:
      enabled: ${APP_BOOTSTRAP_STORE_ENABLED:false}
      name: ${APP_BOOTSTRAP_STORE_NAME:}
      slug: ${APP_BOOTSTRAP_STORE_SLUG:}
      contact-email: ${APP_BOOTSTRAP_STORE_CONTACT_EMAIL:}
      currency: ${APP_BOOTSTRAP_STORE_CURRENCY:BRL}
      timezone: ${APP_BOOTSTRAP_STORE_TIMEZONE:America/Sao_Paulo}
      description: ${APP_BOOTSTRAP_STORE_DESCRIPTION:}
      logo-url: ${APP_BOOTSTRAP_STORE_LOGO_URL:}
      banner-url: ${APP_BOOTSTRAP_STORE_BANNER_URL:}
      primary-color: ${APP_BOOTSTRAP_STORE_PRIMARY_COLOR:}
      secondary-color: ${APP_BOOTSTRAP_STORE_SECONDARY_COLOR:}
      commission-rate: ${APP_BOOTSTRAP_STORE_COMMISSION_RATE:2.50}
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
      last-name: ${APP_BOOTSTRAP_ADMIN_LAST_NAME:Planno}
  media:
    supabase:
      mock-enabled: ${APP_MEDIA_SUPABASE_MOCK_ENABLED:false}
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      public-base-url: ${APP_MEDIA_SUPABASE_PUBLIC_BASE_URL:${SUPABASE_URL:}}
      bucket: ${APP_MEDIA_SUPABASE_BUCKET:store-assets}
      store-image-folder: ${APP_MEDIA_SUPABASE_STORE_IMAGE_FOLDER:stores}

logging:
  level:
    org.flywaydb: info
