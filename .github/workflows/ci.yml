name: CI

on:
  push:
    branches: [homolog]
  pull_request:
    branches: [deploy]

permissions:
  contents: read

jobs:
  backend:
    name: Store backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Run backend tests
        run: ./mvnw --batch-mode test
